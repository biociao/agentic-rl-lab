<svg xmlns="http://www.w3.org/2000/svg" width="840" height="708" viewBox="0 0 840 708" role="img" aria-labelledby="title desc">
<title id="title">Loss 分支：分别改了哪一部分？</title><desc id="desc">这是改动位置的关系图，不是严格的继承链，也不是效果排名。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#486174"/></marker></defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334a; } .title { font-size: 25px; font-weight: 700; } .sub { font-size: 17px; fill: #486174; } .head { font-size: 20px; font-weight: 650; } .body { font-size: 18px; } .small { font-size: 16px; fill: #486174; }</style>
<rect width="840" height="708" rx="16" fill="#fff"/>
<rect x="1" y="1" width="838" height="706" rx="16" fill="none" stroke="#d8e3ed"/>
<rect x="28" y="28" width="5" height="56" rx="2" fill="#087e8b"/>
<text x="48" y="53" class="title" text-anchor="start">Loss 分支：分别改了哪一部分？</text>
<text x="48" y="81" class="sub" text-anchor="start">这是改动位置的关系图，不是严格的继承链，也不是效果排名。</text>
<rect x="222" y="116" width="396" height="87" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="240" y="147" class="head" text-anchor="start">共同起点：ratio × advantage</text>
<text x="240" y="177" class="body" text-anchor="start">用采样数据估计策略更新方向</text>
<rect x="28" y="263" width="372" height="120" rx="12" fill="#edf4fc" stroke="#2265a5" stroke-width="1.5"/>
<text x="46" y="294" class="head" text-anchor="start">PPO · 裁剪代理目标</text>
<text x="46" y="324" class="body" text-anchor="start">min(ratio·A, clip(ratio)·A)</text>
<text x="46" y="351" class="body" text-anchor="start">限制部分过大的更新激励</text>
<rect x="440" y="263" width="372" height="120" rx="12" fill="#f4effa" stroke="#7550a5" stroke-width="1.5"/>
<text x="458" y="294" class="head" text-anchor="start">GSPO · 改变比率的粒度</text>
<text x="458" y="324" class="body" text-anchor="start">长度归一化的序列级比率</text>
<text x="458" y="351" class="body" text-anchor="start">整条回答共享比率与裁剪</text>
<path d="M420,203 L420,229 L214,229 L214,263" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M420,229 L626,229 L626,263" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="441" width="372" height="144" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="46" y="472" class="head" text-anchor="start">CISPO · 改变梯度路径</text>
<text x="46" y="502" class="body" text-anchor="start">c = detach(clip(ratio))</text>
<text x="46" y="529" class="body" text-anchor="start">c · logprob · A</text>
<text x="46" y="556" class="body" text-anchor="start">梯度仍可经 logprob 流动</text>
<path d="M214,383 L214,441" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<text x="214" y="418" class="small" text-anchor="middle">处理裁剪的梯度影响</text>
<rect x="440" y="441" width="372" height="144" rx="12" fill="#fff5e3" stroke="#99600c" stroke-width="1.5"/>
<text x="458" y="472" class="head" text-anchor="start">DAPO · 一组协同改动</text>
<text x="458" y="502" class="body" text-anchor="start">Clip-Higher → 维持探索</text>
<text x="458" y="529" class="body" text-anchor="start">动态采样 → 增加有效组</text>
<text x="458" y="556" class="body" text-anchor="start">token 级 loss + 超长奖励处理</text>
<path d="M400,323 L420,323 L420,412 L626,412 L626,441" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="618" width="784" height="49" rx="10" fill="#e9f7f8"/>
<text x="44" y="646" class="sub" text-anchor="start">读算法时依次问：采样单位是什么？ratio 如何定义？在哪里 clip？梯度从哪里走？</text>
</svg>
