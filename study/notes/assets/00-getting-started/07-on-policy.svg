<svg xmlns="http://www.w3.org/2000/svg" width="840" height="577" viewBox="0 0 840 577" role="img" aria-labelledby="title desc">
<title id="title">On-policy：快照、采样与更新的时间关系</title><desc id="desc">统一记号：p_old 是采样策略，p_new 是待优化策略。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#486174"/></marker></defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334a; } .title { font-size: 25px; font-weight: 700; } .sub { font-size: 17px; fill: #486174; } .head { font-size: 20px; font-weight: 650; } .body { font-size: 18px; } .small { font-size: 16px; fill: #486174; }</style>
<rect width="840" height="577" rx="16" fill="#fff"/>
<rect x="1" y="1" width="838" height="575" rx="16" fill="none" stroke="#d8e3ed"/>
<rect x="28" y="28" width="5" height="56" rx="2" fill="#087e8b"/>
<text x="48" y="53" class="title" text-anchor="start">On-policy：快照、采样与更新的时间关系</text>
<text x="48" y="81" class="sub" text-anchor="start">统一记号：p_old 是采样策略，p_new 是待优化策略。</text>
<rect x="28" y="120" width="230" height="120" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="46" y="151" class="head" text-anchor="start">当前权重 θ_t</text>
<text x="46" y="181" class="body" text-anchor="start">保存采样快照</text>
<text x="46" y="208" class="body" text-anchor="start">得到 sampler</text>
<rect x="305" y="120" width="230" height="120" rx="12" fill="#edf4fc" stroke="#2265a5" stroke-width="1.5"/>
<text x="323" y="151" class="head" text-anchor="start">由 p_old 采样</text>
<text x="323" y="181" class="body" text-anchor="start">生成 rollout</text>
<text x="323" y="208" class="body" text-anchor="start">保留 old logprobs</text>
<rect x="582" y="120" width="230" height="120" rx="12" fill="#f4effa" stroke="#7550a5" stroke-width="1.5"/>
<text x="600" y="151" class="head" text-anchor="start">用 p_new 算 loss</text>
<text x="600" y="181" class="body" text-anchor="start">对同一批 token</text>
<text x="600" y="208" class="body" text-anchor="start">重新计算 logprobs</text>
<path d="M258,180 L305,180" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M535,180 L582,180" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="162" y="298" width="516" height="114" rx="12" fill="#edf4fc" stroke="#2265a5" stroke-width="1.5"/>
<text x="180" y="329" class="head" text-anchor="start">重要性比率：目标概率 / 采样概率</text>
<text x="180" y="359" class="body" text-anchor="start">ratio = p_new(x) / p_old(x)</text>
<text x="180" y="386" class="body" text-anchor="start">E_{p_new}[f] = E_{p_old}[ratio · f]</text>
<path d="M697,240 L697,355 L678,355" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M162,355 L143,355 L143,240" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<text x="420" y="444" class="small" text-anchor="middle">更新后同步下一份快照</text>
<rect x="28" y="473" width="784" height="74" rx="10" fill="#fff5e3"/>
<text x="44" y="501" class="sub" text-anchor="start">若快照、推理设置与参数完全一致，首次更新前 ratio 可以等于 1。</text>
<text x="44" y="526" class="sub" text-anchor="start">参数更新或存在采样滞后后，比率可能偏离 1；差异越大，估计越不稳定。</text>
</svg>
