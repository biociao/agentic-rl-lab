<svg xmlns="http://www.w3.org/2000/svg" width="840" height="546" viewBox="0 0 840 546" role="img" aria-labelledby="title desc">
<title id="title">概念地图：从目标到一次更新</title><desc id="desc">主线是采样—反馈—更新；蒸馏改变反馈来源，Agentic 扩展轨迹。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#486174"/></marker></defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334a; } .title { font-size: 25px; font-weight: 700; } .sub { font-size: 17px; fill: #486174; } .head { font-size: 20px; font-weight: 650; } .body { font-size: 18px; } .small { font-size: 16px; fill: #486174; }</style>
<rect width="840" height="546" rx="16" fill="#fff"/>
<rect x="1" y="1" width="838" height="544" rx="16" fill="none" stroke="#d8e3ed"/>
<rect x="28" y="28" width="5" height="56" rx="2" fill="#087e8b"/>
<text x="48" y="53" class="title" text-anchor="start">概念地图：从目标到一次更新</text>
<text x="48" y="81" class="sub" text-anchor="start">主线是采样—反馈—更新；蒸馏改变反馈来源，Agentic 扩展轨迹。</text>
<rect x="28" y="120" width="230" height="115" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="46" y="151" class="head" text-anchor="start">① policy 采样</text>
<text x="46" y="181" class="body" text-anchor="start">prompt → rollout</text>
<text x="46" y="208" class="body" text-anchor="start">当前策略生成回答</text>
<rect x="305" y="120" width="230" height="115" rx="12" fill="#fff5e3" stroke="#99600c" stroke-width="1.5"/>
<text x="323" y="151" class="head" text-anchor="start">② 评价回答</text>
<text x="323" y="181" class="body" text-anchor="start">reward / 老师反馈</text>
<text x="323" y="208" class="body" text-anchor="start">确定学习信号</text>
<rect x="582" y="120" width="230" height="115" rx="12" fill="#edf4fc" stroke="#2265a5" stroke-width="1.5"/>
<text x="600" y="151" class="head" text-anchor="start">③ 组织更新</text>
<text x="600" y="181" class="body" text-anchor="start">advantage + loss</text>
<text x="600" y="208" class="body" text-anchor="start">得到参数梯度</text>
<path d="M258,177 L305,177" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M535,177 L582,177" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M697,235 L697,269 L143,269 L143,235" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<text x="420" y="263" class="small" text-anchor="middle">更新 policy，再采样</text>
<rect x="28" y="319" width="370" height="124" rx="12" fill="#f4effa" stroke="#7550a5" stroke-width="1.5"/>
<text x="46" y="350" class="head" text-anchor="start">蒸馏支线 · OPD / OPSD</text>
<text x="46" y="380" class="body" text-anchor="start">学生仍生成自己的轨迹</text>
<text x="46" y="407" class="body" text-anchor="start">老师提供逐 token 分布反馈</text>
<rect x="442" y="319" width="370" height="124" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="460" y="350" class="head" text-anchor="start">Agentic 扩展 · 多轮交互</text>
<text x="460" y="380" class="body" text-anchor="start">动作 → 工具 / 环境 → observation</text>
<text x="460" y="407" class="body" text-anchor="start">mask 区分谁生成了哪些 token</text>
<rect x="28" y="465" width="784" height="49" rx="10" fill="#e9f7f8"/>
<text x="44" y="493" class="sub" text-anchor="start">GRPO 决定组内如何形成 advantage；IS / PPO / CISPO / GSPO 处理更新目标。</text>
</svg>
