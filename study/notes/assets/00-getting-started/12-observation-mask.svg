<svg xmlns="http://www.w3.org/2000/svg" width="840" height="592" viewBox="0 0 840 592" role="img" aria-labelledby="title desc">
<title id="title">Agentic RL：看得见，不代表要学着生成</title><desc id="desc">工具返回加入上下文；优化策略时，只让模型动作贡献训练信号。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#486174"/></marker></defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334a; } .title { font-size: 25px; font-weight: 700; } .sub { font-size: 17px; fill: #486174; } .head { font-size: 20px; font-weight: 650; } .body { font-size: 18px; } .small { font-size: 16px; fill: #486174; }</style>
<rect width="840" height="592" rx="16" fill="#fff"/>
<rect x="1" y="1" width="838" height="590" rx="16" fill="none" stroke="#d8e3ed"/>
<rect x="28" y="28" width="5" height="56" rx="2" fill="#087e8b"/>
<text x="48" y="53" class="title" text-anchor="start">Agentic RL：看得见，不代表要学着生成</text>
<text x="48" y="81" class="sub" text-anchor="start">工具返回加入上下文；优化策略时，只让模型动作贡献训练信号。</text>
<rect x="28" y="132" width="170" height="135" rx="12" fill="#edf4fc" stroke="#2265a5" stroke-width="1.5"/>
<text x="46" y="163" class="head" text-anchor="start">prompt</text>
<text x="46" y="193" class="body" text-anchor="start">用户 / 任务</text>
<text x="46" y="220" class="body" text-anchor="start">mask = 0</text>
<rect x="211" y="132" width="190" height="135" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="229" y="163" class="head" text-anchor="start">模型动作 1</text>
<text x="229" y="193" class="body" text-anchor="start">发起工具调用</text>
<text x="229" y="220" class="body" text-anchor="start">mask = 1</text>
<rect x="414" y="132" width="202" height="135" rx="12" fill="#fff5e3" stroke="#99600c" stroke-width="1.5"/>
<text x="432" y="163" class="head" text-anchor="start">observation</text>
<text x="432" y="193" class="body" text-anchor="start">工具 / 环境返回</text>
<text x="432" y="220" class="body" text-anchor="start">mask = 0</text>
<rect x="629" y="132" width="183" height="135" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="647" y="163" class="head" text-anchor="start">模型动作 2</text>
<text x="647" y="193" class="body" text-anchor="start">继续 / 最终回答</text>
<text x="647" y="220" class="body" text-anchor="start">mask = 1</text>
<path d="M198,198 L211,198" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M401,198 L414,198" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M616,198 L629,198" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="320" width="372" height="123" rx="12" fill="#edf4fc" stroke="#2265a5" stroke-width="1.5"/>
<text x="46" y="351" class="head" text-anchor="start">上下文路径</text>
<text x="46" y="381" class="body" text-anchor="start">prompt + 动作 + observation</text>
<text x="46" y="408" class="body" text-anchor="start">全部可供后续 token 预测使用</text>
<rect x="440" y="320" width="372" height="123" rx="12" fill="#e9f7f8" stroke="#087e8b" stroke-width="1.5"/>
<text x="458" y="351" class="head" text-anchor="start">Loss 路径</text>
<text x="458" y="381" class="body" text-anchor="start">Σ mask_t × token_loss_t</text>
<text x="458" y="408" class="body" text-anchor="start">模型动作保留，环境 token 屏蔽</text>
<path d="M515,267 L515,291 L214,291 L214,320" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M714,267 L714,320" fill="none" stroke="#486174" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="476" width="784" height="74" rx="10" fill="#fff5e3"/>
<text x="44" y="504" class="sub" text-anchor="start">掩码是逻辑含义；实现可能用 weights，或把相应 advantages 置 0。</text>
<text x="44" y="529" class="sub" text-anchor="start">关键是把这些位置对 loss 的贡献置零，而不只是把 logprob 的数值写成 0。</text>
</svg>
