<svg xmlns="http://www.w3.org/2000/svg" width="760" height="357" viewBox="0 0 760 357" role="img" aria-labelledby="title desc">
  <title id="title">同样的学习信号，更新力度怎么处理？</title>
  <desc id="desc">IS 直接用未裁剪的概率比；PPO 触发目标裁剪时，这项不再贡献梯度；CISPO 把裁过的概率比当作权重，仍保留学习信号。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#486174"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334a; }
    .title { font-size: 25px; font-weight: 700; }
    .head { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; fill: #486174; }
    .arrow { fill: none; stroke: #486174; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect x="1" y="1" width="758" height="355" rx="16" fill="#fff" stroke="#d8e3ed" stroke-width="2"/>
  <rect x="24" y="23" width="5" height="31" rx="2" fill="#087e8b"/>
  <text x="43" y="47" class="title">三种 loss，差别在怎么更新</text>
  <rect x="191" y="72" width="378" height="44" rx="9" fill="#edf4fc" stroke="#b8d1ea"/>
  <text x="380" y="101" class="head" text-anchor="middle">输入都是：组内学习信号 + 概率比</text>
  <path d="M380 117V136H136V155" class="arrow"/>
  <path d="M380 117V155" class="arrow"/>
  <path d="M380 136H624V155" class="arrow"/>
  <rect x="24" y="159" width="224" height="137" rx="11" fill="#edf4fc" stroke="#b8d1ea"/>
  <rect x="268" y="159" width="224" height="137" rx="11" fill="#fff5e3" stroke="#e1c38f"/>
  <rect x="512" y="159" width="224" height="137" rx="11" fill="#e9f7f8" stroke="#92c9cd"/>
  <g text-anchor="middle">
    <text x="136" y="193" class="head">importance_sampling</text>
    <text x="136" y="232" class="label">直接用概率比</text>
    <text x="136" y="262" class="label">不做裁剪</text>
    <text x="380" y="193" class="head">ppo</text>
    <text x="380" y="232" class="label">裁剪更新目标</text>
    <text x="380" y="262" class="label">触发裁剪的项不再推</text>
    <text x="624" y="193" class="head">cispo</text>
    <text x="624" y="232" class="label">裁过的概率比当权重</text>
    <text x="624" y="262" class="label">有信号的项还能推</text>
    <text x="380" y="330" class="label">换的是更新规则，不是答案怎么给分。</text>
  </g>
</svg>
