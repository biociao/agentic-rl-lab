<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-labelledby="title desc">
  <title id="title">同一道题，四个回答</title>
  <desc id="desc">以 7 加 5 为例，两个回答得 1 分，两个得 0 分。减去组均分 0.5 后分别得到正负 0.5；全同分时没有相对信号。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17334a; }
    .title { font-size: 26px; font-weight: 700; }
    .body { font-size: 20px; }
    .label { font-size: 18px; fill: #486174; }
    .positive { fill: #086772; font-weight: 700; }
    .negative { fill: #8b4d13; font-weight: 700; }
  </style>
  <rect x="1" y="1" width="758" height="370" rx="16" fill="#fff" stroke="#d8e3ed" stroke-width="2"/>
  <rect x="24" y="23" width="5" height="58" rx="2" fill="#087e8b"/>
  <text x="43" y="45" class="title">同一道题，四个回答</text>
  <text x="43" y="74" class="label">示例：7 + 5 = ?　标准答案：12</text>
  <rect x="24" y="95" width="712" height="42" rx="8" fill="#edf4fc"/>
  <g text-anchor="middle" class="label">
    <text x="108" y="122">回答</text>
    <text x="260" y="122">框里的答案</text>
    <text x="410" y="122">得分</text>
    <text x="603" y="122">减去组均分 0.5</text>
  </g>
  <path d="M24 175H736 M24 215H736 M24 255H736 M24 295H736" fill="none" stroke="#d8e3ed"/>
  <g text-anchor="middle" class="body">
    <text x="108" y="163">A</text><text x="260" y="163">12</text><text x="410" y="163">1</text><text x="603" y="163" class="positive">+0.5　鼓励</text>
    <text x="108" y="203">B</text><text x="260" y="203">11</text><text x="410" y="203">0</text><text x="603" y="203" class="negative">−0.5　抑制</text>
    <text x="108" y="243">C</text><text x="260" y="243">12</text><text x="410" y="243">1</text><text x="603" y="243" class="positive">+0.5　鼓励</text>
    <text x="108" y="283">D</text><text x="260" y="283">13</text><text x="410" y="283">0</text><text x="603" y="283" class="negative">−0.5　抑制</text>
  </g>
  <rect x="24" y="313" width="712" height="38" rx="8" fill="#e9f7f8"/>
  <text x="380" y="338" class="label" text-anchor="middle">全对或全错 → 减完都是 0 → 这道题不参与更新</text>
</svg>
